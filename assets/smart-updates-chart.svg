<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4AF626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#30D158;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0051D5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Donut chart -->
  <!-- 86% green arc (309.6 degrees) -->
  <path d="M 100 30 A 50 50 0 1 1 99.9 30"
        fill="none"
        stroke="url(#greenGrad)"
        stroke-width="20"
        stroke-linecap="round"
        transform="rotate(-90 100 100)"/>

  <!-- 14% blue arc (50.4 degrees) -->
  <path d="M 100 30 A 50 50 0 0 1 130 45"
        fill="none"
        stroke="url(#blueGrad)"
        stroke-width="20"
        stroke-linecap="round"
        transform="rotate(270 100 100)"/>

  <!-- Center text -->
  <text x="100" y="95" text-anchor="middle" font-family="-apple-system, SF Pro Display" font-size="28" font-weight="700" fill="#1d1d1f">86%</text>
  <text x="100" y="115" text-anchor="middle" font-family="-apple-system, SF Pro Display" font-size="13" fill="#6e6e73">skip rebuild</text>

  <!-- Legend -->
  <g transform="translate(20, 165)">
    <circle cx="5" cy="5" r="4" fill="url(#greenGrad)"/>
    <text x="15" y="9" font-family="-apple-system" font-size="11" fill="#1d1d1f">Skip rebuild</text>
  </g>
  <g transform="translate(110, 165)">
    <circle cx="5" cy="5" r="4" fill="url(#blueGrad)"/>
    <text x="15" y="9" font-family="-apple-system" font-size="11" fill="#1d1d1f">Reinstall</text>
  </g>
</svg>
